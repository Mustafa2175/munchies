<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Upgrade any insecure requests automatically to HTTPS -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <!-- Automatic client-side HTTPS enforcement fallback for non-localhost environments -->
    <script>
      if (
        window.location.protocol === 'http:' &&
        !['localhost', '127.0.0.1'].includes(window.location.hostname) &&
        !window.location.hostname.endsWith('.localhost')
      ) {
        window.location.replace(
          'https://' +
            window.location.host +
            window.location.pathname +
            window.location.search +
            window.location.hash
        );
      }
    </script>
    <link rel="icon" type="image/jpeg" href="/fb_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="مطعم Munchie's في أسوان – أشهى ساندوتشات الـ Burger، الفات بير، والـ Loaded Fries. لو كبير عليك، اضغطه! 🍔" />
    <title>Munchie's | مانشيز أسوان – لو كبير عليك، اضغطه! 🍔</title>
    <!-- Preload Lama Sans Fonts -->
    <link rel="preload" href="/lama-sans-regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/lama-sans-medium.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/lama-sans-bold.otf" as="font" type="font/otf" crossorigin />
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-white text-[#26212B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
